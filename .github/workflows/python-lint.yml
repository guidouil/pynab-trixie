name: Python lint
on:
  push:
    branches: [trixie]
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install black==26.3.1 flake8==7.3.0 isort==6.0.1
      - name: Check Python files changed by this fork
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACM 4fb37bd52abf2b40a46f3d43386a798d87d4381d HEAD -- '*.py')
          if (( ${#files[@]} )); then
            isort --check-only --profile black --line-length 79 "${files[@]}"
            black --check --target-version py313 "${files[@]}"
            flake8 "${files[@]}"
          fi

{% load static %}
{% load i18n %}
<!DOCTYPE html>
{% get_current_language as language %}
<html lang="{{ language }}">
  <head>
    <meta charset="utf-8">
    <meta name="color-scheme" content="light dark">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="shortcut icon" href="{% static 'nabweb/favicon/favicon.ico' %}"/>
    <link rel="stylesheet" href="{% static "nabweb/css/bootstrap.min.css" %}">
    <link rel="stylesheet" type="text/css" href="{% static "nabweb/css/bootstrap4-clockpicker.min.css" %}">
    <link rel="stylesheet" type="text/css" href="{% static "nabweb/css/nabweb.css" %}">
    <title>{% trans "Nabaztag help" %} :: {% block subtitle %}{% endblock %}</title>
    <script src="{% static "nabweb/js/jquery-3.3.1.min.js" %}"></script>
    <script src="{% static "nabweb/js/popper.min.js" %}"></script>
    <script src="{% static "nabweb/js/bootstrap.min.js" %}"></script>
    <script src="{% static "nabweb/js/bootstrap4-clockpicker.min.js" %}"></script>
    <script src="{% static "nabweb/js/jquery.bootstrap-growl.min.js" %}"></script>

	<script src="https://cdn.jsdelivr.net/gh/xcash/bootstrap-autocomplete@v2.3.7/dist/latest/bootstrap-autocomplete.min.js"></script>

  </head>
  
  <body class="help-page">
    <header class="topbar">
      <nav class="navbar navbar-expand-lg navbar-light page-shell">
        <span class="navbar-brand mb-0 h1">{% trans "Nabaztag help" %}</span>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav mr-auto">
            <li><a class="nav-link" href="/help/"{% if request.path == '/help/' %} aria-current="page"{% endif %}>{% trans "Home" %}</a></li>
          </ul>
          <ul class="nav navbar-nav navbar-right">
            <li><a class="nav-link github-link" href="https://github.com/AntorFr/pynab-ha" target="_blank" rel="noopener noreferrer" aria-label="GitHub"><img src="{% static "nabweb/images/GitHub-Mark-32px.png" %}" title="GitHub" width="20" height="20" /></a></li>
          </ul>
        </div>
      </nav>
    </header>
    <main class="page-shell">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
